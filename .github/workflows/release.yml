# Cut a release when master moves.
#
# The version is not a decision anyone makes here: python-semantic-release
# reads the Conventional Commit subjects since the last tag and derives it.
# fix -> patch, feat -> minor, a ! or a BREAKING CHANGE footer -> major, and
# anything else (docs, chore, ci, ...) -> no release at all, in which case
# this run stops after the first job and nothing is published.
#
# The build happens after the tag exists, from the tag, so the version baked
# into the binary is the version on the release it hangs off. What ships is
# a zip of a folder: the executable carries ffmpeg, Deno, yt-dlp and fpcalc
# with it, and a onefile build would unpack all of that on every launch.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # semantic-release pushes the version bump commit and the tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the tests the release is meant to be made of
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          python -m pytest -q

      - name: Work out the version, tag it, open the release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  executable:
    name: build and attach the archive
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag semantic-release just wrote, not the commit that
          # triggered the run - that one still has the old version in it.
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -e . -r packaging/requirements-build.txt
      - name: Cache the bundled tools
        uses: actions/cache@v4
        with:
          path: build/tools-cache
          key: tools-${{ runner.os }}-${{ hashFiles('packaging/fetch_tools.py') }}
      - run: pyinstaller --clean --noconfirm packaging/lemon-zest.spec

      - name: Check the build actually runs before anyone downloads it
        run: python packaging/smoke_test.py dist/lemon-zest/lemon-zest.exe

      - name: Zip it, named for its version
        id: name
        shell: bash
        run: |
          python packaging/make_zip.py "${{ needs.version.outputs.version }}"
          name="lemon-zest-${{ needs.version.outputs.version }}-windows-x64.zip"
          echo "asset=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" "${{ steps.name.outputs.asset }}" --clobber
