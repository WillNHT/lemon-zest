[project]
name = "lemon-zest"
version = "0.5.0"
description = "Sync a local music library to portable players"
requires-python = ">=3.10"
dependencies = ["mutagen>=1.45", "psutil>=5.9", "click>=8.1", "rich>=13.0", "flask>=3.0"]

[project.optional-dependencies]
# Downloading is optional: a yt-dlp already on PATH is used in preference to
# this one, so an install without it still runs everything else.
youtube = ["yt-dlp>=2024.8.6"]

[project.scripts]
lemon-zest = "lemonzest.cli:main"
lz = "lemonzest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lemonzest*"]

[tool.setuptools.package-data]
lemonzest = ["web/*"]

# Releases are derived from the commit history rather than declared: the
# subjects since the last tag decide whether the next version is a patch, a
# minor or a major, and both copies of the number are rewritten to match.
[tool.semantic_release]
version_variables = ["lemonzest/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}\n\n[skip ci]"
# The release is a Windows executable built in a later job, not a wheel on
# PyPI, so there is nothing to build here.
build_command = ""
tag_format = "v{version}"

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.changelog]
exclude_commit_patterns = ['^chore\(release\):']
