[project]
name = "lemon-zest"
version = "0.2.0"
description = "Sync a local music library to portable players"
requires-python = ">=3.10"
dependencies = ["mutagen>=1.45", "psutil>=5.9", "click>=8.1", "rich>=13.0", "flask>=3.0"]

[project.scripts]
lemon-zest = "lemonzest.cli:main"
lz = "lemonzest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lemonzest*"]

[tool.setuptools.package-data]
lemonzest = ["web/*"]
