[project]
name = "hoard"
version = "0.1.0"
description = "Sync a local music library to portable players"
requires-python = ">=3.10"
dependencies = ["mutagen>=1.45", "psutil>=5.9", "click>=8.1", "rich>=13.0", "flask>=3.0"]

[project.scripts]
hoard = "hoard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hoard*"]

[tool.setuptools.package-data]
hoard = ["web/*"]
